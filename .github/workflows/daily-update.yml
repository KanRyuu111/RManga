name: Daily Manga Release Update

on:
  schedule:
    # 毎日 日本時間 朝8:00（UTC 23:00）に自動実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行用ボタンも有効化

jobs:
  update-manga-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Update Manga List
        run: |
          python -c "
          import datetime
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y年%m月%d日')
          print(f'Updating manga list for {today}...')
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html || true
          git commit -m "Auto-update manga list for $(date +'%Y-%m-%d')" || exit 0
          git push
